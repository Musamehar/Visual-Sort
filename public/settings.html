<style>
        body {
            background-color: #000000;
        }
        
        /* Custom range slider styling */
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #FF6D1F;
            cursor: pointer;
            margin-top: -6px;
            box-shadow: 0 0 10px rgba(255, 109, 31, 0.5);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #262626;
            border-radius: 2px;
        }
        
        /* Toggle Switch Styling */
        .toggle-checkbox:checked {
            right: 0;
            border-color: #FF6D1F;
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #FF6D1F;
            box-shadow: 0 0 8px rgba(255, 109, 31, 0.4);
        }
    </style>
</head>
<body class="text-text-primary min-h-screen flex flex-col font-body-md text-body-md">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-background/80 backdrop-blur-xl border-b border-surface-stroke flex items-center justify-between px-margin-desktop h-16 w-full hidden md:flex">
<div class="flex items-center gap-4">
<button onclick="window.location.href='index.html'" class="text-primary hover:text-primary transition-colors duration-200 active:scale-95 transition-transform flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-lg text-headline-lg text-primary">Settings</h1>
</div>
<div class="font-label-caps text-label-caps tracking-widest text-primary">SORT_VISUALIZER</div>
</header>
<!-- Mobile Header -->
<header class="fixed top-0 w-full z-50 bg-background/80 backdrop-blur-xl border-b border-surface-stroke flex items-center justify-between px-margin-mobile h-16 w-full md:hidden">
<button class="text-primary hover:text-primary transition-colors duration-200 active:scale-95 transition-transform flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary">Settings</h1>
<div class="w-6"></div> <!-- Spacer for alignment -->
</header>
<!-- Main Content -->
<main class="flex-grow pt-24 pb-20 px-margin-mobile md:px-margin-desktop flex justify-center">
<div class="w-full max-w-[600px] flex flex-col gap-12">
<!-- Section 1: Visualizer Preferences -->
<section class="flex flex-col gap-6">
<h2 class="font-headline-lg text-headline-lg text-primary-container border-b border-surface-stroke pb-2">Visualizer Preferences</h2>
<div class="flex flex-col gap-8 bg-surface-container-lowest border border-surface-stroke p-6 rounded-lg">
<!-- Slider 1 -->
<div class="flex flex-col gap-3">
<div class="flex justify-between items-center">
<label class="font-body-md text-body-md text-text-primary">Default Array Size</label>
<span class="font-code-sm text-code-sm text-primary-container">100</span>
</div>
<input class="w-full h-1 bg-surface-stroke rounded-full appearance-none outline-none" max="200" min="10" type="range" value="100"/>
</div>
<!-- Slider 2 -->
<div class="flex flex-col gap-3">
<div class="flex justify-between items-center">
<label class="font-body-md text-body-md text-text-primary">Default Animation Speed</label>
<span class="font-code-sm text-code-sm text-primary-container">3x</span>
</div>
<input class="w-full h-1 bg-surface-stroke rounded-full appearance-none outline-none" max="5" min="1" type="range" value="3"/>
</div>
<!-- Toggle -->
<div class="flex justify-between items-center pt-2 border-t border-surface-stroke">
<label class="font-body-md text-body-md text-text-primary cursor-pointer" for="glow-toggle">Enable Bar Glow Effects</label>
<div class="relative inline-block w-12 mr-2 align-middle select-none transition duration-200 ease-in">
<input checked="" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 border-surface-stroke appearance-none cursor-pointer z-10 transition-transform duration-200 ease-in-out translate-x-6" id="glow-toggle" name="toggle" type="checkbox"/>
<label class="toggle-label block overflow-hidden h-6 rounded-full bg-primary-container cursor-pointer transition-colors duration-200 ease-in-out" for="glow-toggle"></label>
</div>
</div>
</div>
</section>
<!-- Section 2: Backend Configuration -->
<section class="flex flex-col gap-6">
<h2 class="font-headline-lg text-headline-lg text-primary-container border-b border-surface-stroke pb-2">Backend Configuration</h2>
<div class="flex flex-col gap-8 bg-surface-container-lowest border border-surface-stroke p-6 rounded-lg">
<!-- Radio Group -->
<div class="flex flex-col gap-4">
<span class="font-body-md text-body-md text-text-primary mb-2">Execution Mode</span>
<label class="flex items-center gap-3 cursor-pointer group">
<div class="relative flex items-center justify-center">
<input checked="" class="peer appearance-none w-5 h-5 border-2 border-surface-stroke rounded-full checked:border-primary-container bg-transparent transition-colors" name="exec-mode" type="radio"/>
<div class="absolute w-2.5 h-2.5 bg-primary-container rounded-full opacity-0 peer-checked:opacity-100 transition-opacity"></div>
</div>
<span class="font-body-md text-body-md text-text-primary group-hover:text-primary transition-colors">Always use Assembly Backend</span>
</label>
<label class="flex items-center gap-3 cursor-pointer group">
<div class="relative flex items-center justify-center">
<input class="peer appearance-none w-5 h-5 border-2 border-surface-stroke rounded-full checked:border-primary-container bg-transparent transition-colors" name="exec-mode" type="radio"/>
<div class="absolute w-2.5 h-2.5 bg-primary-container rounded-full opacity-0 peer-checked:opacity-100 transition-opacity"></div>
</div>
<span class="font-body-md text-body-md text-text-secondary group-hover:text-text-primary transition-colors">Fallback to JavaScript if API fails</span>
</label>
</div>
<!-- Toggle -->
<div class="flex justify-between items-center pt-4 border-t border-surface-stroke">
<label class="font-body-md text-body-md text-text-primary cursor-pointer" for="log-toggle">Show Terminal Logs on Dashboard</label>
<div class="relative inline-block w-12 mr-2 align-middle select-none transition duration-200 ease-in">
<input class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 border-surface-stroke appearance-none cursor-pointer z-10 transition-transform duration-200 ease-in-out" id="log-toggle" name="toggle" type="checkbox"/>
<label class="toggle-label block overflow-hidden h-6 rounded-full bg-surface-stroke cursor-pointer transition-colors duration-200 ease-in-out" for="log-toggle"></label>
</div>
</div>
</div>
</section>
<!-- Footer Actions -->
<div class="flex flex-col sm:flex-row gap-4 mt-8 pt-8 border-t border-surface-stroke">
<button class="flex-1 bg-[#FF6D1F] hover:bg-primary text-background font-body-md text-body-md py-3 px-6 rounded transition-colors duration-200 hover:shadow-[0_0_10px_rgba(255,109,31,0.5)]">
                    Save Preferences
                </button>
<button class="flex-1 bg-transparent border border-[#262626] hover:border-[#FF6D1F] text-text-primary font-body-md text-body-md py-3 px-6 rounded transition-colors duration-200">
                    Reset to Defaults
                </button>
</div>
</div>
</main>
</body></html>
